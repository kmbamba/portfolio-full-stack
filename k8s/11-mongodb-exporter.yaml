apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb-exporter
  namespace: portfolio
  labels:
    app: mongodb-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongodb-exporter
  template:
    metadata:
      labels:
        app: mongodb-exporter
    spec:
      containers:
      - name: mongodb-exporter
        image: percona/mongodb_exporter:0.40
        args:
          - --mongodb.uri=$(MONGO_URI)
          - --mongodb.direct-connect=false
        envFrom:
          - secretRef:
              name: backend-secret
        ports:
        - containerPort: 9216
          name: metrics
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
---
apiVersion: v1
kind: Service
metadata:
  name: mongodb-exporter-service
  namespace: portfolio
  labels:
    app: mongodb-exporter
spec:
  selector:
    app: mongodb-exporter
  ports:
  - name: metrics
    protocol: TCP
    port: 9216
    targetPort: 9216
  type: ClusterIP